services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wenxi
      POSTGRES_PASSWORD: wenxi
      POSTGRES_DB: wenxi
    ports:
      - '5432:5432'
    volumes:
      - wenxi-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wenxi -d wenxi']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wenxi-pg:
